[project]
name = "cpp-guard-analyzer"
version = "0.1.0"
description = "C++ header include guard analyzer and fixer"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OpenAI", email = "noreply@openai.com" }]
keywords = ["cpp", "include-guard", "analysis", "cli"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent"]

[project.license]
file = "LICENSE"

[project.scripts]
cpp-guard-analyzer = "cpp_guard_analyzer.main:main"

[project.urls]
Repository = "https://github.com/ScobieWorks/cpp-guard-analyzer"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool]

[tool.setuptools]

[tool.setuptools.packages]

[tool.setuptools.packages.find]
where = ["src"]
